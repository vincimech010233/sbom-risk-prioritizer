name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check && cargo clippy --locked -- -D warnings && cargo test --locked
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo run --locked -- --synthetic examples/sbom.json examples/findings.json results/report.json
      - run: python3 src/report.py results/report.json results/report.md && python3 -m unittest discover -s tests -v
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests tools --select E4,E7,E9,F && ruff format --check src tests tools
